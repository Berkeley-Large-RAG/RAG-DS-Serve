<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Serve Blog Preview</title>
    <script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js'></script>
    <!-- Load the same styles the deployed site uses -->
    <link rel="stylesheet" href="assets/infini-gram.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            line-height: 1.6; 
            color: #333;
        }
        h1 { 
            color: #2c3e50; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 10px;
        }
        h2 { 
            color: #2f3d59; 
            margin-top: 30px;
        }
        h3 { 
            color: #2f4a73; 
            margin-top: 25px;
        }
        code { 
            background: #f8f9fa; 
            padding: 2px 6px; 
            border-radius: 3px; 
            font-family: 'Monaco', 'Menlo', monospace;
            color: #e74c3c;
        }
        pre { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-x: auto; 
            border-left: 4px solid #3498db;
        }
        blockquote { 
            border-left: 4px solid #bdc3c7; 
            margin: 0; 
            padding-left: 20px; 
            color: #7f8c8d; 
            font-style: italic;
        }
        strong {
            color: #2c3e50;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        hr {
            border: none;
            border-top: 1px solid #bdc3c7;
            margin: 30px 0;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .cta-links { margin: 10px 0 0; }
        .cta-links a {
            display: inline-block;
            margin: 6px 6px 0;
            padding: 8px 12px;
            border: 1px solid #3498db;
            border-radius: 6px;
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            background: #f0f8ff;
        }
        .cta-links a:hover { background: #e6f3ff; }
    </style>
</head>
<body>
    <!-- Preview-only top tabs removed to match deployed site -->
    <div id='content'></div>
    <script>
        // Load markdown content from the actual file
        fetch('index.md?cb=' + Date.now())
            .then(response => response.text())
            .then(markdown => {
                let cleaned = markdown.replace(/^---[\s\S]*?---\s*/, '');
                // Replace Jekyll relative_url liquid tags for local preview
                cleaned = cleaned
                  .replace(/\{\{\s*'([^']+)'\s*\|\s*relative_url\s*\}\}/g, '$1')
                  .replace(/\{\{\s*\"([^\"]+)\"\s*\|\s*relative_url\s*\}\}/g, '$1');
                document.getElementById('content').innerHTML = marked.parse(cleaned);
            })
            .catch(error => {
                console.error('Error loading markdown:', error);
                // Fallback content
                document.getElementById('content').innerHTML = '<p>Error loading content. Please check the file.</p>';
            });
    </script>
</body>
</html>
