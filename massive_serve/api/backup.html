<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS Serve</title>
  <link rel="icon" type="image/png" href="./styles/logo_small.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --sidebar-width: min(300px, 25vw);
    }

    .param-disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f9fc;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.3s ease;
    }
    body.sidebar-open #historySidebar {
      transform: translateX(0);
    }
.sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    body.sidebar-hidden #historySidebar {
      transform: translateX(-105%);
    }
    @media (min-width: 1024px) {
      #contentArea {
        transition: margin-left 0.3s ease;
      }
      body.sidebar-open #contentArea {
        margin-left: var(--sidebar-width);
      }
      body.sidebar-hidden #contentArea {
        margin-left: 0;
      }
    }
    
    /* Hide scrollbar on parameter panel */
    #paramPanel {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE and Edge */
    }
    #paramPanel::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }
    .rounded-highlight {
      background-color: #fff8b3;
      border-radius: 0.5rem;
      padding: 0 0.3em;
    }
    .try-queries-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: none;
      background: #f5fbff;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f2854;
      box-shadow: 0 4px 14px rgba(15, 40, 84, 0.18);
      min-width: 118px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .try-queries-btn:hover {
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.25);
      transform: translateY(-1px);
    }
    .examples-panel {
      width: min(90vw, 420px);
      background: white;
      border-radius: 1rem;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.15);
      padding: 0.5rem 0.7rem;
    }
    .examples-panel button {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.9rem;
      border-radius: 0.75rem;
      border: 1px solid transparent;
      background: rgba(15, 118, 110, 0.03);
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
.examples-panel button:hover {
  border-color: rgba(15, 118, 110, 0.6);
  background: rgba(15, 118, 110, 0.1);
  transform: translateY(-1px);
}
    .toggle-switch {
      width: 40px;
      height: 20px;
      background-color: #d1d5db;
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .toggle-switch.enabled {
      background-color: #14b8a6;
    }
    .toggle-switch-thumb {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background-color: white;
      border-radius: 9999px;
      transition: transform 0.3s ease;
    }
    .toggle-switch.enabled .toggle-switch-thumb {
      transform: translateX(20px);
    }
    .sidebar-item {
      cursor: pointer;
      border-bottom-width: 1px;
      border-color: rgb(229 231 235);
      padding: 0.75rem;
      transition: color, background-color, border-color, text-decoration-color, fill, stroke;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 0.2s;
    }
    .sidebar-item:hover {
      background-color: rgb(243 244 246);
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    
    /* Lambda Slider Styling */
    .slider {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    
    .slider::-webkit-slider-track {
      background: #e5e7eb;
      height: 8px;
      border-radius: 4px;
    }
    
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      background: #14b8a6;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      cursor: pointer;
    }
    
    .slider::-moz-range-track {
      background: #e5e7eb;
      height: 8px;
      border-radius: 4px;
      border: none;
    }
    
    .slider::-moz-range-thumb {
      background: #14b8a6;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    
    .slider:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* Centered tooltip/help modal */
    .tooltip-centered {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 10000 !important;
      max-width: 90vw !important;
      max-height: 80vh !important;
      overflow-y: auto !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
      border: 2px solid #4a5568 !important;
      padding: 1.25rem !important;
      border-radius: 0.75rem !important;
      background: #111827 !important; /* gray-900 */
      color: #fff !important;
    }
    .tooltip-overlay {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0,0,0,0.5) !important;
      z-index: 9999 !important;
    }

  </style>
</head>
<body>

  </div>

  <!-- Centered Search Group -->
  <div id="centeredSearchGroup" class="fixed bottom-4 left-0 right-0 px-2 sm:px-4 flex justify-center pointer-events-none z-20 overflow-visible transition-all duration-300">
    <div id="searchCard" class="pointer-events-auto bg-white rounded-2xl shadow-lg p-3 sm:p-4 lg:p-5 border border-gray-100 w-full max-w-5xl mx-auto overflow-visible">
      <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-3 lg:gap-4 justify-center">
        <div class="relative">
          <button id="toggleParamsBtn" class="text-xs sm:text-sm bg-gray-100 hover:bg-gray-200 px-2 sm:px-3 py-1 sm:py-2 rounded-md font-medium flex items-center gap-1">
            <svg class="w-3 h-3 sm:w-4 sm:h-4 lg:w-6 lg:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <rect x="4" y="6" width="16" height="12" rx="2"/>
              <line x1="8" y1="10" x2="16" y2="10"/>
              <line x1="8" y1="14" x2="12" y2="14"/>
              <circle cx="18" cy="12" r="1"/>
            </svg>
            <span class="hidden sm:inline">Parameters</span>
            <span class="sm:hidden">Params</span>
          </button>
          <div id="paramPanel" class="hidden absolute bottom-full left-2 right-2 sm:left-auto sm:right-auto mb-2 bg-white border rounded-lg shadow-lg p-2 sm:p-3 lg:p-4 w-auto sm:w-[360px] lg:w-[400px] space-y-1 sm:space-y-3 lg:space-y-4 max-h-[35vh] sm:max-h-[50vh] overflow-y-auto overflow-x-hidden z-30">

            <div class="flex justify-end mb-2">
              <button id="helpBtn" class="text-xs sm:text-sm bg-blue-100 hover:bg-blue-200 w-6 h-6 sm:w-8 sm:h-8 rounded-full font-medium flex items-center justify-center">
                ?

            </div>

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 sm:gap-2">

            </div>
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 sm:gap-2">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 sm:gap-2" id="diskannLRow">

              <input type="number" id="diskannL" min="25" step="25" value="500" class="border rounded-md p-1 text-sm w-20 text-center">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 sm:gap-2" id="diskannWRow">

              <input type="number" id="diskannThreads" min="2" step="2" value="64" class="border rounded-md p-1 text-sm w-20 text-center">

              <circle cx="11" cy="11" r="6"/>

            </svg>

  <!-- History Panel Sidebar -->

  <button id="historyToggleBtn" class="hidden fixed top-24 left-2 z-40 w-8 h-8 rounded-full border border-gray-300 bg-white/90 flex items-center justify-center shadow-lg transition-all duration-300" aria-label="Show history">

  <!-- Main Content Area (adjusted for sidebar) -->
  <div id="contentArea" class="flex-1 flex flex-col items-stretch ml-0 lg:ml-[25%]">

    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-20 bg-gradient-to-b from-white to-gray-50 border-b border-gray-200 shadow-sm">
      <div id="headerContent" class="w-full px-4 py-3 flex items-center justify-center">
        <h1 id="headerTitle" class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">DS Serve</h1>
      </div>
    </header>
    
    <!-- Main results container that scrolls till the top edge -->
    <main class="pt-20 sm:pt-20 lg:pt-24 px-2 sm:px-4 lg:px-6 mb-24 sm:mb-36 overflow-y-auto max-h-[calc(100vh-160px)] sm:max-h-[calc(100vh-112px)]" id="results"></main>
    <!-- Floating Home button: shown only after results are displayed -->
    <button id="homeFab" class="hidden fixed bottom-6 right-6 z-30 bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold px-3 py-2 rounded-full border border-gray-200 shadow-lg transition-colors flex items-center gap-2" aria-label="Return to home">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-8 9 8M5 12v7a1 1 0 001 1h4m4 0h4a1 1 0 001-1v-7"/>
      </svg>
      <span class="hidden sm:inline">Home</span>
    </button>



  </div>

  <script>
    // Minimal: use current origin (IP:port) as API base; no DNS
    const API_BASE = window.location.origin;
    // Preserve multi-line query content with single-line input by intercepting paste
    window.__preservedPasteRaw = null;       // raw text with \n
    window.__preservedPasteDisplay = null;   // what is shown in the input (\n -> space)
    document.body.classList.add('sidebar-open');

    const bodyEl = document.body;
    let queryHistory = [];

    function showHomeButton(show) {
      const homeFab = document.getElementById('homeFab');
      if (!homeFab) return;
      homeFab.classList.toggle('hidden', !show);
    }

    function goHome() {
      const qi = document.getElementById('queryInput');
      const resultsEl = document.getElementById('results');
      const welcomeMessage = document.getElementById('welcomeMessage');
      const centeredSearchGroup = document.getElementById('centeredSearchGroup');
      const paramPanel = document.getElementById('paramPanel');
      if (qi) qi.value = '';
      if (resultsEl) resultsEl.innerHTML = '';
      if (welcomeMessage) welcomeMessage.style.display = 'flex';
      if (centeredSearchGroup) centeredSearchGroup.style.display = 'flex';
      if (paramPanel) paramPanel.classList.add('hidden');
      if (typeof expandedPassages !== 'undefined' && expandedPassages?.clear) expandedPassages.clear();
      if (typeof expandedPassagesData !== 'undefined' && expandedPassagesData?.clear) expandedPassagesData.clear();
      showHomeButton(false);
      resultsEl?.scrollTo?.({ top: 0, behavior: 'smooth' });
    }

    const HELP_CONTENT = {
      shared: [
        { label: 'n_docs (k)', description: 'Number of passages returned and displayed.' },
        { label: 'Exact Search', description: 'Runs an exact rerank on top of ANN results for better accuracy at the cost of latency.' },
        { label: 'Diverse Search', description: 'Penalizes near-duplicate passages so the final set covers more unique information.' },
        { label: 'λ (lambda)', description: 'Tradeoff knob used with Diverse Search. Lower λ favors accuracy, higher λ favors coverage.' },
        { label: 'Min words', description: 'Filter out passages shorter than this threshold before final selection.' }
      ],
      ivfpq: [
        { label: 'nprobe', description: 'Number of IVF clusters scanned per query. Increase for higher recall at the cost of slightly more latency.' }
      ],
      diskann: [
        { label: 'DiskANN L', description: 'Candidate list size explored each iteration. Larger L yields higher recall but adds latency linearly.' },
        { label: 'DiskANN W', description: 'Beam width for traversing the DiskANN graph. Wider beams reduce latency. NOTE: Thoeretically, higher W might reduce accuracy/recall, but the negative effect is often negligible.' },
        { label: 'DiskANN Threads', description: 'Customize the number of CPU threads used by DiskANN. Higher increases speed.' }
      ]
    };
    
    function isSidebarOpen() {
      return bodyEl.classList.contains('sidebar-open');
    }

    function openSidebar() {
      bodyEl.classList.add('sidebar-open');
      bodyEl.classList.remove('sidebar-hidden');
      syncHistoryPills();
      adjustSearchGroupPosition();
    }

    function closeSidebar() {
      bodyEl.classList.add('sidebar-hidden');
      bodyEl.classList.remove('sidebar-open');
      syncHistoryPills();
      adjustSearchGroupPosition();
    }

    function syncHistoryPills() {
      const showBtn = document.getElementById('historyToggleBtn');
      const showLabel = document.getElementById('historyToggleLabel');
      const hideBtn = document.getElementById('sidebarHidePill');
      if (!showBtn || !showLabel || !hideBtn) return;
      const desktop = window.innerWidth >= 1024;
      if (desktop) {
        hideBtn.classList.remove('hidden');
        if (isSidebarOpen()) {
          showBtn.classList.add('hidden');
        } else {
          showBtn.classList.remove('hidden');
          showLabel.textContent = 'Show history';
        }
      } else {
        hideBtn.classList.add('hidden');
        showBtn.classList.remove('hidden');
        showLabel.textContent = isSidebarOpen() ? 'Hide history' : 'Show history';
      }
    }

    function adjustSearchGroupPosition() {
      const searchGroup = document.getElementById('centeredSearchGroup');
      const welcomeMessage = document.getElementById('welcomeMessage');
      const sidebar = document.getElementById('historySidebar');
      const headerContent = document.getElementById('headerContent');
      const queryHeader = document.querySelector('[data-query-header]');
      if (!searchGroup || !welcomeMessage || !sidebar || !headerContent) return;

      const isDesktop = window.innerWidth >= 1024;
      const sidebarWidth = (isDesktop && isSidebarOpen()) ? sidebar.offsetWidth : 0;

      if (isDesktop) {
        searchGroup.style.left = `${sidebarWidth}px`;
        searchGroup.style.right = '0px';
        welcomeMessage.style.left = `${sidebarWidth}px`;
        welcomeMessage.style.right = '0px';
        headerContent.style.marginLeft = `${sidebarWidth}px`;
        headerContent.style.marginRight = '0px';
        headerContent.style.width = `calc(100% - ${sidebarWidth}px)`;
        if (queryHeader) {
          queryHeader.style.left = `${sidebarWidth}px`;
          queryHeader.style.right = '0px';
        }
      } else {
        searchGroup.style.left = '0px';
        searchGroup.style.right = '0px';
        welcomeMessage.style.left = '0px';
        welcomeMessage.style.right = '0px';
        headerContent.style.marginLeft = '0px';
        headerContent.style.marginRight = '0px';
        headerContent.style.width = '100%';
        if (queryHeader) {
          queryHeader.style.left = '0px';
          queryHeader.style.right = '0px';
        }
      }
    }

    function autoHideSidebarOnSmallScreens() {
      if (window.innerWidth < 1024) {
        closeSidebar();
      } else {
        openSidebar();
      }
    }

    // Load query history from localStorage
    function loadQueryHistory() {
      try {
        const saved = localStorage.getItem('ds-serve-search-history');
        if (saved) {
          queryHistory = JSON.parse(saved);
          renderQueryHistory();
        }
      } catch (error) {
        console.error('Failed to load query history:', error);
      }
    }

    // Save query history to localStorage
    function saveQueryHistory() {
      try {
        const toSave = queryHistory.slice(0, 50); // Keep only last 50 queries
        localStorage.setItem('ds-serve-search-history', JSON.stringify(toSave));
      } catch (error) {
        console.error('Failed to save query history:', error);
      }
    }

    // Add query to history
    function addToHistory(query, results, searchParams, latency) {
      const historyItem = {
        id: Date.now(),
        query: query,
        timestamp: new Date().toISOString(),
        results: results,
        searchParams: searchParams,
        latency: latency
      };
      queryHistory.unshift(historyItem);
      saveQueryHistory();
      renderQueryHistory();
    }

    // Render query history
    function renderQueryHistory() {
      const container = document.getElementById('queryHistory');
      if (queryHistory.length === 0) {
        container.innerHTML = '<p class="p-4 text-gray-500 text-sm">No search history yet</p>';
        return;
      }

      container.innerHTML = queryHistory.map(item => renderHistoryItem(item)).join('');
      attachHistoryEventListeners();
    }

    // Render individual history item
    function renderHistoryItem(item) {
      const date = new Date(item.timestamp).toLocaleDateString();
      const time = new Date(item.timestamp).toLocaleTimeString();
      const safeHistoryQuery = escapeHtml(item.query || '');
      
      return `
        <div class="sidebar-item group hover:bg-gray-100 cursor-pointer" data-id="${item.id}" data-select-query>
          <div class="flex justify-between items-start">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium text-gray-900 truncate">Searched: "<span class="font-semibold">${safeHistoryQuery}</span>"</div>
              <div class="text-xs text-gray-500 mt-1">${date} ${time}</div>
              ${item.latency ? `<div class="text-xs text-gray-400">${item.latency}s</div>` : ''}
            </div>
            <div class="hidden group-hover:flex gap-1 ml-2">
              <button data-delete-query class="text-xs text-red-500 hover:text-red-700">Delete</button>
            </div>
          </div>
        </div>
      `;
    }

    // Attach event listeners to history items
    function attachHistoryEventListeners() {
                   // Select query
      document.querySelectorAll('[data-select-query]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          // Don't trigger if clicking on delete button
          if (e.target.closest('[data-delete-query]')) {
            return;
          }
          
          const id = parseInt(e.target.closest('[data-id]').dataset.id);
          const item = queryHistory.find(h => h.id === id);
          if (item) {
            document.getElementById('queryInput').value = item.query;
            displayResults(item.results, item.query, item.searchParams, item.latency);
            showHomeButton(true);
          }
        });
      });



      // Delete query
      document.querySelectorAll('[data-delete-query]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(e.target.closest('[data-id]').dataset.id);
          const deletedItem = queryHistory.find(h => h.id === id);
          
          // Check if we're currently viewing this deleted item
          const currentQuery = document.getElementById('queryInput').value;
          const isCurrentlyViewing = deletedItem && currentQuery === deletedItem.query;
          
          // Remove from history
          queryHistory = queryHistory.filter(h => h.id !== id);
          saveQueryHistory();
          renderQueryHistory();
          
          // If we're currently viewing the deleted item, clear the page and show welcome
          if (isCurrentlyViewing) {
            // Clear the query input
            document.getElementById('queryInput').value = '';
            
            // Clear the results
            document.getElementById('results').innerHTML = '';
            
            // Show welcome message, title, and centered search group
            const welcomeMessage = document.getElementById('welcomeMessage');
            const centeredSearchGroup = document.getElementById('centeredSearchGroup');
            if (welcomeMessage) {
              welcomeMessage.style.display = 'flex';
            }
            if (centeredSearchGroup) {
              centeredSearchGroup.style.display = 'flex';
            }
            showHomeButton(false);
          }
        });
      });


    }

    let isSearching = false;

    // Loading state management
    function setLoading(loading) {
      isSearching = loading;
      const sendButton = document.getElementById('sendButton');
      const loadingSpinner = document.getElementById('loadingSpinner');
      
      if (loading) {
        sendButton.classList.add('hidden');
        loadingSpinner.classList.remove('hidden');
      } else {
        sendButton.classList.remove('hidden');
        loadingSpinner.classList.add('hidden');
      }
    }

    function setupExampleQueries() {
      const toggleBtn = document.getElementById('tryQueriesToggle');
      const panel = document.getElementById('tryQueriesPanel');
      const input = document.getElementById('queryInput');
      if (!toggleBtn || !panel || !input) return;

      const closePanel = () => {
        panel.classList.add('hidden');
        toggleBtn.setAttribute('aria-expanded', 'false');
        toggleBtn.querySelector('svg')?.setAttribute('style', 'transform: none;');
      };

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const willShow = panel.classList.contains('hidden');
        panel.classList.toggle('hidden', !willShow);
        toggleBtn.setAttribute('aria-expanded', String(willShow));
        toggleBtn.querySelector('svg')?.setAttribute('style', willShow ? 'transform: rotate(180deg); transition: transform 0.2s ease;' : 'transform: none; transition: transform 0.2s ease;');
      });

      panel.querySelectorAll('[data-example-query]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const text = btn.getAttribute('data-example-query') || btn.textContent.trim();
          input.value = text;
          input.focus();
          closePanel();
        });
      });

      document.addEventListener('click', (e) => {
        if (!panel.contains(e.target) && !toggleBtn.contains(e.target)) {
          closePanel();
        }
      });
    }

          // Display results (existing function, enhanced)
    function displayResults(data, query, searchParams, latency) {
      const container = document.getElementById('results');
      container.innerHTML = '';
      
      // Hide welcome message and title when displaying results
      const welcomeMessage = document.getElementById('welcomeMessage');
      if (welcomeMessage) {
        welcomeMessage.style.display = 'none';
      }
      showHomeButton(true);
      // Do NOT hide the search group here!
      
      // Add query and parameter display at the top (fixed position)
      if (query) {
        const backendSelect = document.getElementById('backend');
        const backend = searchParams?.backend || searchParams?.method || (backendSelect && backendSelect.value ? backendSelect.value : 'diskann');
        const nprobe = (searchParams?.nprobe ?? document.getElementById('nprobe')?.value ?? '').toString().trim();
        const effectiveNprobe = nprobe !== '' ? nprobe : (document.getElementById('nprobe')?.value || '');
        const k = searchParams?.k || document.getElementById('k').value;
        const minWordsChip = searchParams?.minWords ?? (document.getElementById('minWords')?.value || '').trim();
        const useRerank = searchParams?.useRerank !== undefined ? searchParams.useRerank : document.getElementById('rerankToggle').classList.contains('enabled');
        const useDiverse = searchParams?.useDiverse !== undefined ? searchParams.useDiverse : document.getElementById('diverseToggle').classList.contains('enabled');
        const lambdaVal = searchParams?.lambdaVal || document.getElementById('lambda').value;
        
        
        const isLongQuery = (query || '').length > 25; // fallback; actual collapse decided after measuring
        const safeQuery = escapeHtml(query || '');
        // Build preview for summary: first ~25 chars, cut at word boundary, add ellipsis if truncated
        const previewLimit = 25;
        let previewRaw = (query || '').slice(0, previewLimit);
        if ((query || '').length > previewLimit) {
          let cut = (query || '').slice(0, previewLimit);
          const lastSpace = cut.lastIndexOf(' ');
          if (lastSpace > 0) cut = cut.slice(0, lastSpace);
          previewRaw = cut + '...';
        }
        const previewEscaped = escapeHtml(previewRaw);

        // Escape single quotes for safe embedding inside single-quoted attributes
        const safeQueryAttr = (safeQuery || '').replace(/'/g, "&#39;");
        const previewAttr = (previewEscaped || '').replace(/'/g, "&#39;");

        const queryDisplay = document.createElement('div');
        queryDisplay.className = "text-gray-700 text-lg font-medium mb-4 bg-[#f7f9fc] py-3 px-4 shadow-sm rounded-lg fixed top-0 left-0 right-2 z-20";
        queryDisplay.setAttribute('data-query-header', '1');
        // append first for measuring available width
        container.appendChild(queryDisplay);

        const collapse = shouldCollapseQuery(safeQuery, queryDisplay);
        const headerMarkup = collapse
          ? `<details class="mt-1" data-query-collapsible data-full='${safeQueryAttr}' data-preview='${previewAttr}'>
               <summary class="cursor-pointer select-none">Searched: <span class="font-semibold whitespace-pre-wrap break-words">"${previewEscaped}"</span></summary>
             </details>`
          : `<div>Searched: <span class="font-semibold whitespace-pre-wrap break-words">"${safeQuery}"</span></div>`;

        // DiskANN vs IVFPQ specific chips
        const diskannL = searchParams?.diskannL || document.getElementById('diskannL')?.value;
        const diskannW = searchParams?.diskannW || document.getElementById('diskannW')?.value;
        const diskannThreads = searchParams?.diskannThreads || document.getElementById('diskannThreads')?.value;

        queryDisplay.innerHTML = `
          ${headerMarkup}
          <div class="flex gap-2 mt-2 flex-wrap" id="queryMeta">
            <span class="bg-indigo-100 text-indigo-700 text-sm font-semibold px-2 py-1 rounded-full">backend: ${backend}</span>
            ${backend === 'diskann'
              ? `<span class="bg-gray-200 text-gray-700 text-sm px-2 py-1 rounded-full">L: ${diskannL}</span>
                 <span class=\"bg-gray-200 text-gray-700 text-sm px-2 py-1 rounded-full\">W: ${diskannW}</span>
                 <span class=\"bg-gray-200 text-gray-700 text-sm px-2 py-1 rounded-full\">threads: ${diskannThreads}</span>`
              : `<span class=\"bg-gray-200 text-gray-700 text-sm px-2 py-1 rounded-full\">nprobe: ${effectiveNprobe}</span>`}
            <span class="bg-gray-200 text-gray-700 text-sm px-2 py-1 rounded-full">k: ${k}</span>
            ${minWordsChip !== '' ? `<span class="bg-gray-200 text-gray-700 text-sm px-2 py-1 rounded-full">Min Words: ${minWordsChip}</span>` : ''}
            ${useRerank ? '<span class="bg-teal-100 text-teal-700 text-sm px-2 py-1 rounded-full">Exact Search</span>' : ''}
            ${useDiverse ? '<span class="bg-blue-100 text-blue-700 text-sm px-2 py-1 rounded-full">Diverse Search</span>' : ''}
            ${useDiverse ? `<span class="bg-blue-100 text-blue-700 text-sm px-2 py-1 rounded-full">λ: ${lambdaVal}</span>` : ''}
            ${latency ? `<span class="bg-green-100 text-green-700 text-sm px-2 py-1 rounded-full flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path></svg>${latency}s</span>` : ''}
          </div>
        `;
        // Insert/update spacer so first passage starts below the fixed header
        ensureResultsSpacer(container, queryDisplay);
        // Initialize collapsible behavior to swap preview with full text without repetition
        initQueryCollapsible(queryDisplay);
        // On resize, recompute collapse based on available width
        setupResponsiveHeader(queryDisplay);
        adjustSearchGroupPosition();
      }
      
      const passages = data?.results?.passages?.[0] || [];

      if (passages.length > 0) {
        passages.forEach((p, i) => {
          const div = document.createElement('div');
          div.className = 'bg-white p-3 sm:p-4 rounded-2xl shadow-md mb-3 sm:mb-4 relative overflow-hidden';
          div.setAttribute('data-passage-id', p.index_id || i);
          // Prefer per-passage scores: exact score (when exact search), else retrieval score (ANN)
          let scoreText = '';
          if (typeof p["exact score"] === 'number') {
            scoreText = ` • Exact Score: <span class='font-medium text-blue-600'>${p["exact score"].toFixed(8)}</span>`;
          } else if (typeof p["retrieval score"] === 'number') {
            scoreText = ` • ANN Score: <span class='font-medium text-blue-600'>${p["retrieval score"].toFixed(8)}</span>`;
          }
          div.innerHTML = `
            <div class='text-sm text-gray-600 mb-2'>#${i + 1} • Source: <span class='font-medium'>${p.source || 'unknown'}</span>${scoreText}</div>
            <div class='text-gray-900 leading-relaxed mb-4 whitespace-pre-wrap break-words' data-original-raw="${p.text.replace(/"/g, '&quot;')}">${escapeHtml(p.text)}</div>
            
            <!-- Show More/Less Section -->
            <div class="mt-4 pt-4 border-t border-gray-200">
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                  <button 
                    class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded text-sm transition-colors"
                    data-show-more
                    data-index-id="${p.index_id || i}"
                    data-offset="1"
                  >
                    Show More
                  </button>
                </div>
              </div>
            </div>
            
            <!-- Rating Feedback Section -->
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-3 lg:mt-0 lg:absolute lg:bottom-4 lg:right-4" data-vote-box>
                <span class="text-sm sm:text-base font-semibold text-blue-600">Is this passage relevant?</span>
                <button 
                    class="text-sm font-semibold text-blue-600 hover:text-green-600 transition-colors px-1.5 py-0.5"
                    title="Yes, this passage is relevant"
                    data-vote="yes"
                    data-passage-id="${(p.passage_id ?? '').toString().replace(/"/g, '&quot;')}"
                >
                    [YES]
                </button>
                <button 
                    class="text-sm font-semibold text-blue-600 hover:text-red-600 transition-colors px-1.5 py-0.5"
                    title="No, this passage is not relevant"
                    data-vote="no"
                    data-passage-id="${(p.passage_id ?? '').toString().replace(/"/g, '&quot;')}"
                >
                    [NO]
                </button>
            </div>
          `;
          container.appendChild(div);
        });
        
        // Attach event listeners for Show More/Less functionality
        attachShowMoreListeners();
        // [disk-vote] attach vote listeners tied to current query
        attachVoteListeners(query, searchParams);
      } else {
        const noResultsDiv = document.createElement('div');
        noResultsDiv.className = 'bg-red-50 border border-red-300 text-red-700 p-6 rounded-2xl shadow-md text-center max-w-2xl mx-auto mt-10';
        noResultsDiv.innerHTML = `
          <h3 class="text-2xl font-semibold mb-2"> Oops!</h3>
          <p class="mb-4">We couldn't find enough results for your query.</p>
          <p class="text-sm text-red-600">Please try:</p>
          <ul class="text-sm list-disc list-inside mt-2 text-red-600">
            <li>Adding more details</li>
            <li>Rephrasing your query</li>
            <li>Changing the search parameters</li>
          </ul>
        `;
        container.appendChild(noResultsDiv);
      }
    }

    // Method toggle: gray out non-applicable params instead of hiding
    function setRowDisabled(rowEl, disabled) {
      if (!rowEl) return;
      rowEl.classList.toggle('param-disabled', !!disabled);
      // disable inputs within
      rowEl.querySelectorAll('input, select, button').forEach(el => {
        if (el.id === 'rerankToggle' || el.id === 'diverseToggle') return; // handled separately
        if ('disabled' in el) el.disabled = !!disabled;
      });
    }
    function updateMethodUI() {
      const methodSel = document.getElementById('backend');
      const isDiskANN = methodSel && methodSel.value === 'diskann';
      const nprobeRow = document.getElementById('nprobe').parentElement;
      const rerankBtn = document.getElementById('rerankToggle');
      const diverseBtn = document.getElementById('diverseToggle');
      const lambdaRow = document.getElementById('lambdaRow');
      const diskannLRow = document.getElementById('diskannLRow');
      const diskannWRow = document.getElementById('diskannWRow');
      const diskannThreadsRow = document.getElementById('diskannThreadsRow');

      // Gray out IVFPQ params when DiskANN
      setRowDisabled(nprobeRow, isDiskANN);
      setRowDisabled(rerankBtn.parentElement, isDiskANN);

      // Gray out DiskANN params when IVFPQ
      setRowDisabled(diskannLRow, !isDiskANN);
      setRowDisabled(diskannWRow, !isDiskANN);
      setRowDisabled(diskannThreadsRow, !isDiskANN);
    }
    document.getElementById('backend').addEventListener('change', updateMethodUI);
    // Initialize state on load
    document.addEventListener('DOMContentLoaded', updateMethodUI);

    document.getElementById('queryInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        submitQuery(true);
      }
    });

    document.getElementById('sendButton').addEventListener('click', function () {
      submitQuery(true);
    });
    document.getElementById('homeFab')?.addEventListener('click', goHome);

    function toggleLambdaState() {
      const lambda = document.getElementById('lambda');
      const lambdaValue = document.getElementById('lambdaValue');
      const diverse = document.getElementById('diverseToggle');
      const enabled = diverse.classList.contains('enabled');
      lambda.disabled = !enabled;
      if (!enabled) {
        lambdaValue.classList.add('text-gray-400');
      } else {
        lambdaValue.classList.remove('text-gray-400');
      }
    }

    // Lambda slider event listener
    document.getElementById('lambda').addEventListener('input', function() {
      const value = parseFloat(this.value) / 100;
      document.getElementById('lambdaValue').textContent = value.toFixed(2);
    });



    async function submitQuery(addToHist) {
      // Hide parameter panel when submitting query
      document.getElementById('paramPanel').classList.add('hidden');
      if (isSearching) {
        return;
      }
      
      const qi = document.getElementById('queryInput');
      const displayVal = qi.value;
      // Prefer preserved raw (with newlines) if input hasn't diverged since paste
      let candidate = (window.__preservedPasteRaw && window.__preservedPasteDisplay === displayVal)
        ? window.__preservedPasteRaw
        : displayVal.replace(/\\n/g, "\n"); // allow manual \\n entry
      const query = candidate.replace(/\r\n|\r/g, "\n").trim();
      const backendSelect = document.getElementById('backend');
      const method = backendSelect && backendSelect.value ? backendSelect.value : 'diskann';
      const nprobe = document.getElementById('nprobe').value;
      const diskannL = document.getElementById('diskannL').value;
      const diskannW = document.getElementById('diskannW').value;
      const diskannThreads = document.getElementById('diskannThreads').value;
      const k = document.getElementById('k').value;
      const minWordsRaw = (document.getElementById('minWords')?.value || '').trim();
      const minWords = minWordsRaw === '' ? null : Math.max(0, parseInt(minWordsRaw, 10));
      
      const useRerank = document.getElementById('rerankToggle').classList.contains('enabled');
      const useDiverse = document.getElementById('diverseToggle').classList.contains('enabled');
      const lambdaVal = parseFloat(document.getElementById('lambda').value) / 100;
      
      if (!query) return;
      
      const container = document.getElementById('results');
      // Hide welcome message when starting search
      const welcomeMessage = document.getElementById('welcomeMessage');
      if (welcomeMessage) {
        welcomeMessage.style.display = 'none';
      }
      container.innerHTML = '';
      
      // Show loading state
      setLoading(true);
      
      const loadingMsg = document.createElement('div');
      loadingMsg.className = "text-gray-500 text-sm flex items-center gap-2";
      loadingMsg.innerHTML = `
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Searching...
      `;
      container.appendChild(loadingMsg);
      
      const startTime = performance.now();
      
      try {
        const response = await fetch(`${API_BASE}/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query,
            backend: method,
            nprobe: method === 'diskann' ? undefined : parseInt(nprobe),
            n_docs: parseInt(k),
            exact_search: method === 'diskann' ? false : useRerank,
            diverse_search: useDiverse,
            lambda: useDiverse ? lambdaVal : undefined,
            
            diskann_L: method === 'diskann' ? parseInt(diskannL) : undefined,
            diskann_W: method === 'diskann' ? parseInt(diskannW) : undefined,
            diskann_threads: method === 'diskann' ? parseInt(diskannThreads) : undefined,
            min_words: (minWords !== null && Number.isFinite(minWords)) ? minWords : undefined
          })
        });
        
        const data = await response.json();
        const endTime = performance.now();
        const latency = ((endTime - startTime) / 1000).toFixed(2);
        
        container.innerHTML = '';
        
         if (addToHist) {
           const searchParams = { backend: method, method, nprobe, diskannL, diskannW, diskannThreads, k, useRerank, useDiverse, lambdaVal, minWords: (minWords !== null && Number.isFinite(minWords)) ? minWords : '' };
           addToHistory(query, data, searchParams, latency);
         }
         
         displayResults(data, query, { backend: method, method, nprobe, diskannL, diskannW, diskannThreads, k, useRerank, useDiverse, lambdaVal, minWords: (minWords !== null && Number.isFinite(minWords)) ? minWords : '' }, latency);
        
      } catch (err) {
        container.innerHTML = '<div class="text-red-500 text-sm">Error fetching result.</div>';
        console.error(err);
      } finally {
        setLoading(false);
      }
      showHomeButton(true);
    }

    // Show More/Less functionality
    let expandedPassages = new Set();
    let expandedPassagesData = new Map();

    function attachShowMoreListeners() {
      document.querySelectorAll('[data-show-more]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const indexId = parseInt(e.target.dataset.indexId);
          const offset = parseInt(e.target.dataset.offset);
          
          if (expandedPassages.has(indexId)) {
            // Collapse - restore original text
            expandedPassages.delete(indexId);
            e.target.textContent = 'Show More';
            e.target.dataset.offset = '1';
            removeExpandedPassages(indexId);
            
            const passageDiv = e.target.closest('.bg-white');
            const textDiv = passageDiv.querySelector('[data-original-raw]');
            if (textDiv) {
              const originalRaw = textDiv.getAttribute('data-original-raw');
              textDiv.innerHTML = originalRaw;
            }
            
            // Scroll to top of the passage
            const resultsContainer = document.getElementById('results');
            const passageTop = passageDiv.offsetTop;
            const containerTop = resultsContainer.offsetTop;
            const scrollTarget = passageTop - containerTop - 135;
            
            resultsContainer.scrollTo({
              top: scrollTarget,
              behavior: 'smooth'
            });
          } else {
            // Immediate UI feedback
            expandedPassages.add(indexId);
            e.target.textContent = 'Loading...';
            e.target.disabled = true;
            
            // Cache DOM elements to avoid repeated queries
            const passageDiv = e.target.closest('.bg-white');
            const textDiv = passageDiv.querySelector('[data-original-raw]');
            const originalRaw = textDiv.getAttribute('data-original-raw');
            
            try {
              const expandedData = await expandPassage(indexId, offset);
              if (expandedData && expandedData.results && expandedData.results.passages) {
                const expandedPassagesData = expandedData.results.passages[0] || [];
                setExpandedPassages(indexId, expandedPassagesData);
                
                // Replace text in place with expanded content
                if (textDiv && expandedPassagesData.length > 0) {
                  const expandedText = expandedPassagesData[0].text;
                  
                  // Optimized highlighting - only process if needed
                  const highlightedText = highlightOriginalTextOptimized(expandedText, originalRaw);
                  textDiv.innerHTML = highlightedText;
                  textDiv.setAttribute('data-expanded-text', highlightedText);
                }
                
                const newOffset = (parseInt(e.target.dataset.offset) || 1) + 1;
                e.target.dataset.offset = newOffset;
                e.target.textContent = 'Show Less';
                e.target.disabled = false;
                
                if (newOffset > 3) {
                  e.target.disabled = true;
                  e.target.classList.add('text-gray-400', 'cursor-not-allowed');
                  e.target.classList.remove('hover:bg-gray-200');
                  e.target.textContent = 'Expansion limit reached';
                }
              }
            } catch (error) {
              console.error('Expand error:', error);
              e.target.textContent = 'Show More';
              e.target.disabled = false;
              expandedPassages.delete(indexId);
            }
          }
        });
      });
    }

    // ============================ [disk-vote] BEGIN additions ============================
    function attachVoteListeners(queryForVote, latestParams = {}) {
      const toInt = (val) => {
        if (val === null || val === undefined || val === '') return undefined;
        const num = parseInt(val, 10);
        return Number.isNaN(num) ? undefined : num;
      };
      try {
        document.querySelectorAll('[data-vote-box]').forEach(box => {
          box.querySelectorAll('[data-vote]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const vote = e.currentTarget.getAttribute('data-vote');
              const passageId = e.currentTarget.getAttribute('data-passage-id');
              const relevant = vote === 'yes';
              const parent = e.currentTarget.parentElement;
              // [disk-vote] include current search parameters for analysis
              const backendSelect = document.getElementById('backend');
              const backend = latestParams?.method || latestParams?.backend || (backendSelect && backendSelect.value ? backendSelect.value : 'diskann');
              const nprobeCandidate = latestParams?.nprobe ?? document.getElementById('nprobe')?.value;
              const defaultUseRerank = document.getElementById('rerankToggle')?.classList.contains('enabled');
              const defaultUseDiverse = document.getElementById('diverseToggle')?.classList.contains('enabled');
              const useRerank = latestParams?.useRerank !== undefined ? !!latestParams.useRerank : !!defaultUseRerank;
              const useDiverse = latestParams?.useDiverse !== undefined ? !!latestParams.useDiverse : !!defaultUseDiverse;
              const lambdaInputVal = parseFloat(document.getElementById('lambda')?.value || '50') / 100;
              const lambdaVal = typeof latestParams?.lambdaVal === 'number' ? latestParams.lambdaVal : lambdaInputVal;
              const kCandidate = latestParams?.k ?? document.getElementById('k')?.value;
              const minWordsCandidate = (latestParams && latestParams.minWords !== undefined)
                ? latestParams.minWords
                : document.getElementById('minWords')?.value;
              const diskannLCandidate = latestParams?.diskannL ?? document.getElementById('diskannL')?.value;
              const diskannWCandidate = latestParams?.diskannW ?? document.getElementById('diskannW')?.value;
              const diskannThreadsCandidate = latestParams?.diskannThreads ?? document.getElementById('diskannThreads')?.value;
              const configPayload = {
                backend,
                k: typeof kCandidate === 'number' ? kCandidate : toInt(kCandidate),
                min_words: typeof minWordsCandidate === 'number' ? minWordsCandidate : toInt(minWordsCandidate),
                nprobe: backend === 'diskann' ? undefined : toInt(nprobeCandidate),
                exact_search: backend === 'diskann' ? false : useRerank,
                diverse_search: useDiverse,
                lambda: useDiverse ? lambdaVal : 0,
                diskann_L: backend === 'diskann' ? (typeof diskannLCandidate === 'number' ? diskannLCandidate : toInt(diskannLCandidate)) : undefined,
                diskann_W: backend === 'diskann' ? (typeof diskannWCandidate === 'number' ? diskannWCandidate : toInt(diskannWCandidate)) : undefined,
                diskann_threads: backend === 'diskann' ? (typeof diskannThreadsCandidate === 'number' ? diskannThreadsCandidate : toInt(diskannThreadsCandidate)) : undefined,
              };
              try {
                await fetch(`${API_BASE}/vote`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    query: queryForVote || document.getElementById('queryInput')?.value || '',
                    passage_id: passageId,
                    relevant: relevant,
                    backend: backend,
                    config: configPayload
                  })
                });
                parent.innerHTML = relevant
                  ? '<span class="text-sm text-green-600 font-medium">✓ Thanks for the feedback!</span>'
                  : '<span class="text-sm text-red-600 font-medium">✗ Thanks for the feedback!</span>';
              } catch (err) {
                console.error('Vote submit failed:', err);
              }
            });
          });
        });
      } catch (e) {
        console.error('attachVoteListeners failed:', e);
      }
    }
    // ============================ [disk-vote] END additions ============================

    async function expandPassage(indexId, offset) {
      try {
        const response = await fetch(`${API_BASE}/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: '',
            expand_index_id: indexId,
            expand_offset: offset
          })
        });
        return await response.json();
      } catch (error) {
        console.error('Expand request failed:', error);
        throw error;
      }
    }

    function setExpandedPassages(indexId, passages) {
      expandedPassagesData.set(indexId, passages);
    }

    function getExpandedPassages(indexId) {
      return expandedPassagesData.get(indexId) || [];
    }

    function removeExpandedPassages(indexId) {
      expandedPassagesData.delete(indexId);
    }

    // Helper functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function toHexString(num) {
      // Convert to hex with full precision
      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);
      view.setFloat64(0, num);
      const hex = Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
      return '0x' + hex;
    }

    // Initialize query collapsible behavior to avoid repeated content below
    function initQueryCollapsible(scope) {
      (scope || document).querySelectorAll('details[data-query-collapsible]').forEach((dt) => {
        const summary = dt.querySelector('summary');
        const full = dt.dataset.full || '';
        const preview = dt.dataset.preview || '';
        dt.addEventListener('toggle', () => {
          const content = dt.open ? full : preview;
          if (summary) {
        summary.innerHTML = `Searched: <span class="font-semibold whitespace-pre-wrap break-words">"${content}"</span>`;
          }
        });
      });
    }

    // Decide if header should collapse based on rendered width (one-line fit)
    function shouldCollapseQuery(fullHtmlEscaped, headerContainer) {
      // Create a temporary measurement element with same styling
      const temp = document.createElement('div');
      temp.style.position = 'absolute';
      temp.style.visibility = 'hidden';
      temp.style.whiteSpace = 'nowrap';
      temp.style.fontWeight = '600';
      temp.style.fontSize = getComputedStyle(headerContainer).fontSize || '1rem';
      temp.style.maxWidth = 'none';
      temp.innerHTML = `Searched: <span class="font-semibold whitespace-pre-wrap break-words">"${fullHtmlEscaped}"</span>`;
      document.body.appendChild(temp);
      const textWidth = temp.getBoundingClientRect().width;
      document.body.removeChild(temp);

      // Available width inside the container (padding already applied on container)
      const containerWidth = headerContainer.getBoundingClientRect().width;
      // Heuristic: allow some headroom for the meta badges that follow; collapse if text would wrap
      const reservedForBadges = 260; // px buffer for chips; tuned for mobile/desktop
      return textWidth > Math.max(0, containerWidth - reservedForBadges);
    }

    // Re-evaluate collapse on resize
    function setupResponsiveHeader(scope) {
      const container = scope || document;
      const relayout = () => {
        const queryBox = container; // the same wrapper we created
        if (!queryBox) return;
        const full = queryBox.dataset.full;
        const preview = queryBox.dataset.preview;
        if (!full || !preview) return;

        const collapse = shouldCollapseQuery(full, queryBox);
        const existsDetails = queryBox.querySelector('details[data-query-collapsible]');
        if (collapse && !existsDetails) {
          queryBox.insertAdjacentHTML('afterbegin', `<details class="mt-1" data-query-collapsible data-full='${full.replace(/'/g, "&#39;")}' data-preview='${preview.replace(/'/g, "&#39;")}'><summary class="cursor-pointer select-none">Searched: <span class="font-semibold whitespace-pre-wrap break-words">"${preview}"</span></summary></details>`);
          // remove static div header if present
          const staticDiv = queryBox.querySelector(':scope > div');
          if (staticDiv) staticDiv.remove();
          initQueryCollapsible(queryBox);
        } else if (!collapse) {
          // replace details with static full text
          const det = existsDetails;
          if (det) det.remove();
          queryBox.insertAdjacentHTML('afterbegin', `<div>Searched: <span class="font-semibold whitespace-pre-wrap break-words">"${full}"</span></div>`);
        }
      };
      window.addEventListener('resize', relayout);
      // Run once now
      setTimeout(relayout, 0);
    }

    // Ensure a spacer element exists under the fixed header so content doesn't hide behind it
    function ensureResultsSpacer(resultsContainer, headerEl) {
      if (!resultsContainer || !headerEl) return;
      let spacer = resultsContainer.querySelector('[data-results-spacer]');
      if (!spacer) {
        spacer = document.createElement('div');
        spacer.setAttribute('data-results-spacer', '1');
        resultsContainer.prepend(spacer);
      }
      const updateSpacer = () => {
        const rect = headerEl.getBoundingClientRect();
        const margin = 4; // breathing room
        const isOpen = !!headerEl.querySelector('details[data-query-collapsible][open]');
        // When collapsed, use a compact spacer; when expanded, use full height to prevent overlap
        const target = isOpen
          ? Math.max(0, Math.round(rect.height + margin))
          : Math.max(0, Math.round((rect.height + margin) / 3));
        spacer.style.height = `${target}px`;
      };
      updateSpacer();
      // Update on resize and when details toggle may change height
      window.addEventListener('resize', updateSpacer);
      const details = headerEl.querySelector('details[data-query-collapsible]');
      if (details) {
        details.addEventListener('toggle', () => setTimeout(updateSpacer, 0));
      }
      // Also update after responsive relayout changes header structure
      setTimeout(updateSpacer, 0);
    }

    function highlightOriginalText(expandedText, originalText) {
      const escapedExpanded = escapeHtml(expandedText);
      const escapedOriginal = escapeHtml(originalText);

      if (escapedExpanded.includes(escapedOriginal)) {
        return escapedExpanded.replace(
          escapedOriginal,
          `<span class="rounded-highlight">${escapedOriginal}</span>`
        );
      }

      console.warn("Exact match for original passage not found in expanded text");
      return escapedExpanded;
    }

    // Optimized version with early exit and caching
    function highlightOriginalTextOptimized(expandedText, originalText) {
      // Early exit if texts are identical
      if (expandedText === originalText) {
        return `<span class="rounded-highlight">${escapeHtml(originalText)}</span>`;
      }
      
      // Quick check if original text is contained in expanded text
      if (!expandedText.includes(originalText)) {
        return escapeHtml(expandedText);
      }
      
      // Only escape if we need to highlight
      const escapedExpanded = escapeHtml(expandedText);
      const escapedOriginal = escapeHtml(originalText);
      
      if (escapedExpanded.includes(escapedOriginal)) {
        return escapedExpanded.replace(
          escapedOriginal,
          `<span class="rounded-highlight">${escapedOriginal}</span>`
        );
      }
      
      return escapedExpanded;
    }



    const historyToggleBtn = document.getElementById('historyToggleBtn');
    const hidePill = document.getElementById('sidebarHidePill');
    if (historyToggleBtn) {
      historyToggleBtn.addEventListener('click', () => {
        if (window.innerWidth < 1024 && isSidebarOpen()) {
          closeSidebar();
        } else {
          openSidebar();
        }
      });
    }
    if (hidePill) {
      hidePill.addEventListener('click', (e) => {
        e.preventDefault();
        closeSidebar();
      });
    }

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
      if (window.innerWidth >= 1024) return;
      const sidebar = document.getElementById('historySidebar');
      if (!sidebar) return;
      if (historyToggleBtn && historyToggleBtn.contains(e.target)) return;
      if (!sidebar.contains(e.target) && isSidebarOpen()) {
        closeSidebar();
      }
    });

    // Position parameter panel to avoid covering search bar
    function positionParamPanel() {
      const paramPanel = document.getElementById('paramPanel');
      const searchGroup = document.getElementById('centeredSearchGroup');
      if (!paramPanel || !searchGroup) return;

      if (window.innerWidth < 640) {
        // Make the panel fixed and full-width with safe margins on mobile
        const searchRect = searchGroup.getBoundingClientRect();
        const viewportHeight = window.innerHeight;
        const safeBottomPx = Math.max(8, viewportHeight - searchRect.top + 8); // stay above bar

        paramPanel.style.position = 'fixed';
        paramPanel.style.left = '8px';
        paramPanel.style.right = '8px';
        paramPanel.style.width = 'auto';
        paramPanel.style.bottom = `${safeBottomPx}px`;
        paramPanel.style.maxWidth = 'none';
        paramPanel.style.transform = 'none';
      } else {
        // Restore defaults for larger screens; allow CSS classes to handle layout
        paramPanel.style.position = '';
        paramPanel.style.left = '';
        paramPanel.style.right = '';
        paramPanel.style.width = '';
        paramPanel.style.bottom = '';
        paramPanel.style.maxWidth = '';
        paramPanel.style.transform = '';
      }
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadQueryHistory();
      const welcomeMessage = document.getElementById('welcomeMessage');
      const centeredSearchGroup = document.getElementById('centeredSearchGroup');
      if (welcomeMessage) welcomeMessage.style.display = 'flex';
      if (centeredSearchGroup) centeredSearchGroup.style.display = 'flex';

      autoHideSidebarOnSmallScreens();
      syncHistoryPills();
      adjustSearchGroupPosition();
      window.addEventListener('resize', () => {
        autoHideSidebarOnSmallScreens();
        syncHistoryPills();
        adjustSearchGroupPosition();
      });

      // Wire help button
      const helpBtn = document.getElementById('helpBtn');
      if (helpBtn) {
        helpBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          openHelpCover();
        });
      }
      
      // Position parameter panel on load and resize
      positionParamPanel();
      window.addEventListener('resize', positionParamPanel);
      
      // Position panel when it becomes visible
      const toggleParamsBtn = document.getElementById('toggleParamsBtn');
      if (toggleParamsBtn) {
        toggleParamsBtn.addEventListener('click', () => {
          setTimeout(positionParamPanel, 10); // Small delay to ensure panel is visible
        });
      }

      setupExampleQueries();

      // Paste handling for query input to preserve internal newlines while keeping box single-line
      const qi = document.getElementById('queryInput');
      if (qi) {
        qi.addEventListener('paste', (e) => {
          try {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            const raw = (text || '').replace(/\r\n|\r/g, "\n");
            window.__preservedPasteRaw = raw;
            window.__preservedPasteDisplay = raw.replace(/\n/g, ' ');
            qi.value = window.__preservedPasteDisplay;
          } catch (_) { /* no-op */ }
        });
        qi.addEventListener('input', () => {
          if (window.__preservedPasteDisplay !== qi.value) {
            window.__preservedPasteRaw = null;
            window.__preservedPasteDisplay = null;
          }
        });
      }
    });

  </script>
